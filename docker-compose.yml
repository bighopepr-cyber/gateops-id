services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateops
      POSTGRES_USER: gateops
      POSTGRES_PASSWORD: gateops_local_only
    ports:
      - "54329:5432"
    volumes:
      - gateops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateops -d gateops"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  gateops_postgres:
